name: Django CI/CD

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create false 
          poetry config installer.max-workers 2   

      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi

      - name: Run Flake8
        run: poetry run flake8 .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
           python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create false 
          poetry config installer.max-workers 2

      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi

      - name: Start services (Docker Compose)
        run: |
          # Создаем .env файл. Убедитесь, что ВСЕ необходимые переменные передаются из secrets.
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" > .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env # <-- САМОЕ ВАЖНОЕ
          echo "DATABASE_PORT=5432" >> .env
          echo "DATABASE_NAME=${{ secrets.POSTGRES_DB }}" >> .env # Убедитесь, что совпадает с POSTGRES_DB
          
          # Другие переменные, которые могут быть нужны для docker-compose.yml
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
          echo "EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}" >> .env
          echo "EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}" >> .env

          echo "Created .env file for Docker Compose."
          
          # Запускаем сервисы. Docker Compose подхватит .env файл.
          docker compose up -d db redis

      - name: Debug DB Startup
        run: |
          echo "--- Docker ps -a output ---"
          docker ps -a # Показывает все контейнеры (запущенные и остановленные)
          echo "--- Docker Compose logs for db ---"
          docker logs --tail 100 db || echo "Could not get logs for db container. Maybe it did not start or is not named 'db'."
          echo "--- Docker Compose logs for all services ---"
          docker compose logs # Показывает логи всех сервисов
      
      

      - name: Run migrations
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_NAME: ${{ secrets.POSTGRES_DB }}
          DATABASE_USER: ${{ secrets.POSTGRES_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST: ${{ steps.db_info.outputs.db_ip_address }}
          DATABASE_PORT: 5432
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        run: |
              poetry run python manage.py migrate

      - name: Run tests
        env:
            POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
            POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
            POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
            # Используем IP-адрес, полученный в предыдущем шаге
            DATABASE_HOST: ${{ steps.db_info.outputs.db_ip_address }}
            DATABASE_PORT: 5432
        run: poetry run python manage.py test

      - name: Stop services (Docker Compose)
        if: always()
        run: docker compose down -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in in Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image in Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Copy docker-compose.yml to server
        run: |
            scp -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/var/www/drf_project/docker-compose.yml

      - name: Create .env file on server
        run: |
          ssh -tt -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            mkdir -p /var/www/drf_project
            echo DATABASE_URL=${{ secrets.DATABASE_URL }} > /var/www/drf_project/.env
            echo POSTGRES_USER=postgres >> /var/www/drf_project/.env
            echo POSTGRES_DB=drf_project >> /var/www/drf_project/.env
            echo POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} >> /var/www/drf_project/.env
            echo DATABASE_PORT=5432 >> /var/www/drf_project/.env
            "

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets. SERVER_IP }} << 'EOF'
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
          docker stop myapp || true
          docker rm myapp || true
          docker run -d --name myapp -p 80:8000 -e DJANGO_SETTINGS_MODULE=drf_project.settings.production \
          -v /code/static:/code/static \
           ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
          EOF
