[tool.poetry]
name = "drf-project"
version = "0.1.0"
description = ""
authors = ["Daria Kolisnyk <dashamel17@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.2.4"
djangorestframework = "^3.16.0"
python-dotenv = "^1.1.1"
psycopg2-binary = "^2.9.10"
pillow = "^11.3.0"
django-filter = "^25.1"
djangorestframework-simplejwt = "^5.5.0"
coverage = "^7.9.2"
drf-yasg = "^1.21.10"
requests = "^2.32.4"
stripe = "^12.3.0"
celery = "^5.5.3"
redis = "^6.2.0"
eventlet = "^0.40.2"
django-celery-beat = "^2.8.1"


[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.3.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude ="""
(
    /)
        /.git
      | /.eggs
      | /.mypy_cache
      | /.venv
    (/
    | foo.py
)
"""

[tool.isort]
line_length = 119
